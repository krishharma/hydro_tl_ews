# Walk-forward (rolling-origin) operational evaluation, 2017-2020.
name: walk_forward_target
stage: walk_forward
seed: 42

data:
  source: camels
  camels_root: data/CAMELS_US
  target_basin: "11264500"
  full_period: ["1990-01-01", "2020-12-31"]
  sequence_length: 365

model:
  pretrained_checkpoint: results/checkpoints/finetune_conservative.pt
  hidden_size: 256
  dropout: 0.4

walk_forward:
  initial_train_end: "2016-12-31"
  eval_end: "2020-12-31"
  refit_every_days: 90
  online_bias_correction: true
  fine_tune:
    head_lr: 1.0e-3
    lstm_lr: 1.0e-5
    epochs_head_only: 3
    epochs_progressive: 0
    patience: 2
    unfreeze_fraction: 0.0

evaluation:
  thresholds: [q95, q99, q5]
  lead_times: [1, 3, 7]
  metrics: [NSE, KGE, PBIAS, AUC, F1, Brier]

xai:
  enabled: true
  background_size: 200
  sample_size: 100
  seasonal_breakdown: true

output:
  results_path: results/walk_forward.parquet
  metrics_path: results/walk_forward_metrics.json
